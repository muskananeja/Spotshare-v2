<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpotShare</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
  crossorigin="anonymous"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
  crossorigin="anonymous"></script>
<style>
/* ─────────────────────────────────────────
   RESET & ROOT
───────────────────────────────────────── */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --c-green:  #16a34a;
  --c-yellow: #d97706;
  --c-red:    #dc2626;
  --c-blue:   #2563eb;
  --c-ink:    #111827;
  --c-sub:    #6b7280;
  --c-border: #f1f5f9;
  --c-bg:     #f8fafc;
  --nav-h:    68px;
  --r-card:   18px;
  --r-sheet:  24px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.07), 0 6px 20px rgba(0,0,0,.09);
  --shadow-sheet: 0 -4px 32px rgba(0,0,0,.12);
}

/* ── BODY ── */
html { height: 100%; background: var(--c-bg); }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--c-bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* On wide screens: sidebar panel left, map right */
@media (min-width: 768px) {
  :root { --panel-w: 380px; }

  /* map fills the whole viewport; panel sits on top-left */
  #map, #resultsMap { position: absolute; inset: 0; }

  /* screens are full-viewport, no column stacking */
  .screen { position: absolute; inset: 0; }

  /* ── map screen: panel strip on left, map behind ── */
  #map-screen .map-top {
    top: 0; left: 0; width: var(--panel-w);
    padding: 20px 14px 0;
    z-index: 15;
  }
  #map-screen .search-results {
    position: absolute; top: calc(20px + 48px + 8px);
    left: 14px; right: 14px; width: auto;
  }
  .map-legend {
    bottom: calc(var(--nav-h) + 10px); left: calc(var(--panel-w) + 14px);
  }
  .map-locate {
    bottom: calc(var(--nav-h) + 10px); right: 14px;
  }
  .cards-strip {
    position: absolute;
    top: 120px; left: 0;
    bottom: var(--nav-h);
    width: var(--panel-w);
    flex-direction: column;
    overflow-x: hidden; overflow-y: auto;
    padding: 0 14px 14px;
    gap: 10px;
    scroll-snap-type: none;
    background: none;
  }
  .p-card { width: 100%; }
  .bnav {
    left: 0; width: var(--panel-w);
  }

  /* sheet and overlay: constrained to panel width */
  .sheet-overlay { right: auto; width: var(--panel-w); }
  .p-sheet {
    left: 0; right: auto; width: var(--panel-w);
    transform: translateY(100%);
    border-radius: 24px 24px 0 0;
  }
  .p-sheet.on { transform: translateY(0); }

  /* results screen: list panel left, map right */
  #results-screen { flex-direction: row; }
  .results-header {
    position: absolute; top: 0; left: 0; width: var(--panel-w);
    padding: 20px 14px 12px;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    z-index: 20;
  }
  .results-header .search-results {
    position: absolute; top: 100%; left: 14px; right: 14px; width: auto; margin-top: 4px;
  }
  .results-body { flex: 1; display: flex; flex-direction: row; }
  .results-map-half {
    position: absolute;
    top: 0; left: var(--panel-w); right: 0; bottom: 0;
    flex: none;
  }
  .results-list-half {
    position: absolute;
    top: 80px; left: 0; width: var(--panel-w); bottom: 0;
    border-radius: 0; margin-top: 0;
    border-right: 1px solid #e5e7eb;
    box-shadow: none;
    overflow-y: auto;
  }
  .results-list-handle { display: none; }
}

/* ─────────────────────────────────────────
   SCREENS
───────────────────────────────────────── */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ─────────────────────────────────────────
   MAP SCREEN
───────────────────────────────────────── */
#map {
  position: absolute; inset: 0; z-index: 0;
}
.leaflet-tile {
  filter: hue-rotate(168deg) saturate(.35) brightness(1.07) contrast(.9);
}
.leaflet-container { background: #d4e8ef; }
.leaflet-attribution-flag { display: none !important; }
.leaflet-control-attribution {
  font-size: 9px; background: rgba(255,255,255,.6) !important;
  border-radius: 6px 0 0 0;
}

/* ── TOP: search + zone pill ── */
.map-top {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 10; padding: 52px 14px 0;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}

.search-bar {
  background: #fff;
  border-radius: 16px;
  padding: 0 14px;
  height: 48px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow-card);
  pointer-events: all;
  overflow: hidden;
}
.search-bar svg {
  width: 17px; height: 17px;
  stroke: var(--c-sub); fill: none; stroke-width: 2;
  flex-shrink: 0;
}
.search-input {
  flex: 1; border: none; outline: none;
  font-size: 15px; font-weight: 500; color: var(--c-ink);
  background: none; font-family: inherit;
  min-width: 0;
}
.search-input::placeholder { color: #9ca3af; }
.search-clear {
  background: none; border: none; cursor: pointer;
  color: #9ca3af; font-size: 20px; line-height: 1;
  display: none; padding: 4px; flex-shrink: 0;
}
.search-results {
  display: none;
  position: absolute; top: calc(52px + 48px + 8px);
  left: 14px; right: 14px;
  background: #fff; border-radius: 14px;
  box-shadow: var(--shadow-card);
  overflow: hidden; z-index: 20;
  pointer-events: all;
}
.sri {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer; transition: background .1s;
}
.sri:last-child { border: none; }
.sri:active { background: var(--c-bg); }
.sri-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--c-bg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sri-icon svg { width: 14px; height: 14px; stroke: var(--c-sub); fill: none; stroke-width: 2; }
.sri-text {}
.sri-main { font-size: 14px; font-weight: 600; color: var(--c-ink); }
.sri-sub  { font-size: 12px; color: var(--c-sub); margin-top: 1px; }


/* ── RESTRICTION CAUTION BANNER ── */
.restriction-banner {
  display: flex; align-items: center; gap: 10px;
  background: #fff5f5; border: 1.5px solid #fecaca;
  border-radius: 16px;
  padding: 10px 14px;
  box-shadow: var(--shadow-card);
  pointer-events: all;
  max-width: 100%;
  opacity: 0; transform: translateY(-6px);
  transition: opacity .25s ease, transform .25s ease;
}
.restriction-banner.on { opacity: 1; transform: translateY(0); }
.restriction-banner-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-red); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900;
}
.restriction-banner-text { min-width: 0; }
.restriction-banner-title { font-size: 13px; font-weight: 800; color: #7f1d1d; }
.restriction-banner-sub {
  font-size: 12px; color: #991b1b; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── RESULTS SCREEN (full-screen search results: map top / list bottom) ── */
#results-screen { background: #fff; }
.results-header {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 52px 14px 12px;
  background: #fff;
  position: relative; z-index: 20;
}
.results-back-btn {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-bg); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.results-back-btn svg { width: 20px; height: 20px; stroke: var(--c-ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.results-header .search-bar { flex: 1; }
.results-header .search-results {
  position: absolute; top: 100%; left: 64px; right: 14px;
  margin-top: 6px;
}
.results-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.results-map-half { flex: 1; position: relative; min-height: 0; }
.results-map-half #resultsMap { position: absolute; inset: 0; }
.results-list-half {
  flex: 1; min-height: 0; overflow-y: auto;
  background: #fff;
  border-radius: 20px 20px 0 0;
  margin-top: -16px; position: relative; z-index: 5;
  box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  padding-bottom: 20px;
}
.results-list-handle { width: 36px; height: 4px; background: #e5e7eb; border-radius: 2px; margin: 10px auto 4px; }
.results-location-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px 12px;
  border-bottom: 1px solid var(--c-border);
}
.results-location-icon {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-ink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.results-location-name { font-size: 15px; font-weight: 800; color: var(--c-ink); }
.results-location-sub { font-size: 12px; color: var(--c-sub); margin-top: 1px; }
.rl-card {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer; transition: background .12s;
}
.rl-card:last-child { border: none; }
.rl-card:active, .rl-card.active { background: var(--c-bg); }
/* badge matches the real map pin: white fill, colored ring + letter — not a solid color dot */
.rl-card-badge {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  border: 2.5px solid currentColor;
  box-shadow: 0 1px 4px rgba(0,0,0,.15);
}
.rl-card-body { flex: 1; min-width: 0; }
.rl-card-name { font-size: 14px; font-weight: 700; color: var(--c-ink); }
.rl-card-meta { font-size: 12px; color: var(--c-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rl-card-dist { flex-shrink: 0; text-align: right; }
.rl-card-dist-num { font-size: 16px; font-weight: 900; color: var(--c-ink); }
.rl-card-dist-unit { font-size: 11px; color: var(--c-sub); }
/* neutral (not colored) directions shortcut — colour is reserved for the active/tapped state */
.rl-card-directions {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-ink); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.rl-card-directions svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.rl-empty { padding: 40px 24px; text-align: center; color: var(--c-sub); font-size: 14px; }

/* ── MAP EXTRAS ── */
.map-locate {
  position: absolute; z-index: 10;
  bottom: calc(var(--nav-h) + 126px); right: 14px;
  width: 40px; height: 40px; border-radius: 50%;
  background: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-card);
}
.map-locate svg { width: 18px; height: 18px; stroke: var(--c-blue); fill: none; stroke-width: 2; }

.map-legend {
  position: absolute; z-index: 10;
  bottom: calc(var(--nav-h) + 126px); left: 14px;
  background: #fff; border-radius: 20px;
  padding: 6px 12px;
  display: flex; gap: 12px;
  box-shadow: var(--shadow-card);
  font-size: 11px; font-weight: 600; color: var(--c-ink);
}
.leg { display: flex; align-items: center; gap: 4px; }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── PARKING CARDS (bottom strip) ── */
.cards-strip {
  position: absolute; z-index: 10;
  bottom: calc(var(--nav-h) + 10px);
  left: 0; right: 0;
  display: flex; gap: 10px;
  padding: 0 14px;
  overflow-x: auto; overflow-y: visible;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.cards-strip::-webkit-scrollbar { display: none; }

.p-card {
  flex-shrink: 0; width: 220px;
  background: #fff; border-radius: var(--r-card);
  padding: 14px;
  box-shadow: var(--shadow-card);
  scroll-snap-align: start;
  cursor: pointer;
  transition: transform .15s;
}
.p-card:active { transform: scale(.97); }
.p-card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px;
  margin-bottom: 8px;
}
.p-card-name {
  font-size: 13px; font-weight: 700; color: var(--c-ink);
  line-height: 1.3; flex: 1;
}
.p-card-badge {
  font-size: 11px; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; flex-shrink: 0;
}
.p-card-badge.open   { background: #dcfce7; color: #15803d; }
.p-card-badge.limited{ background: #fef9c3; color: #a16207; }
.p-card-dist {
  font-size: 36px; font-weight: 900; color: var(--c-ink);
  letter-spacing: -.02em; line-height: 1;
}
.p-card-dist .unit-min { font-size: 13px; font-weight: 600; color: var(--c-sub); margin-left: 2px; }
.p-card-meta {
  font-size: 11px; color: var(--c-sub); margin-top: 5px;
  display: flex; align-items: center; gap: 4px;
}
.p-card-meta strong { color: var(--c-ink); font-weight: 700; }

/* ── MAP PINS ── */
.pin-wrap {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; user-select: none;
}
.pin-circle {
  width: 40px; height: 40px; border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
  border: 2.5px solid currentColor;
  position: relative;
}
.pin-circle::after {
  content: '';
  position: absolute; bottom: -7px; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: currentColor;
  border-bottom: none;
}
.pin-wrap.green  .pin-circle { color: var(--c-green); }
.pin-wrap.yellow .pin-circle { color: var(--c-yellow); }
.pin-wrap.me     .pin-circle { color: var(--c-blue); background: #eff6ff; border-width: 3px; }
.pin-wrap.rpt    .pin-circle {
  color: var(--c-blue); background: #eff6ff;
  animation: pin-pulse 1.2s ease-in-out 4;
}
@keyframes pin-pulse {
  0%,100% { box-shadow: 0 2px 8px rgba(37,99,235,.3); }
  50%      { box-shadow: 0 2px 20px rgba(37,99,235,.7); }
}
.pin-nearest-label {
  background: var(--c-blue); color: #fff;
  font-size: 9px; font-weight: 800;
  padding: 2px 6px; border-radius: 6px;
  margin-top: 4px; white-space: nowrap;
  letter-spacing: .04em;
  box-shadow: 0 1px 4px rgba(37,99,235,.4);
}

/* caution pin for restriction segments (smaller, sits on the road line) */
.pin-caution {
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(220,38,38,.45);
  border: 3px solid var(--c-red);
  cursor: pointer;
  position: relative;
}
.pin-caution::after {
  content: '';
  position: absolute;
  width: 24px; height: 3px;
  background: var(--c-red);
  transform: rotate(-45deg);
}
/* user dot (no circle/tail) */
.user-dot {
  width: 72px; height: 72px; border-radius: 50%;
  background: rgba(37,99,235,.12);
  display: flex; align-items: center; justify-content: center;
}
.user-dot-inner {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--c-blue); border: 3px solid #fff;
  box-shadow: 0 0 0 4px rgba(37,99,235,.25);
}

/* ─────────────────────────────────────────
   BOTTOM NAV (shared)
───────────────────────────────────────── */
.bnav {
  position: absolute; bottom: 0; left: 0; right: 0;
  z-index: 20;
  height: var(--nav-h);
  background: #fff;
  border-top: 1px solid #e5e7eb;
  display: flex; align-items: center;
  padding: 0 4px env(safe-area-inset-bottom, 0);
}
.bnav-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; height: 100%;
  border: none; background: none; cursor: pointer;
  padding-bottom: 4px;
}
.bnav-tab svg {
  width: 22px; height: 22px;
  stroke: #9ca3af; fill: none; stroke-width: 1.75;
  transition: stroke .2s;
}
.bnav-tab .nt {
  font-size: 10px; font-weight: 700;
  color: #9ca3af; letter-spacing: .03em;
  text-transform: uppercase; transition: color .2s;
}
.bnav-tab.on svg  { stroke: var(--c-blue); }
.bnav-tab.on .nt  { color: var(--c-blue); }

/* Report FAB — 60px visual, 72px tap target */
.bnav-fab {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--c-red);
  box-shadow: 0 4px 16px rgba(220,38,38,.45);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin: 0 6px;
  transition: transform .12s;
  position: relative; top: -6px;
  /* extend tap target 6px beyond visual circle on all sides */
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.bnav-fab::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
}
.bnav-fab:active { transform: scale(.91); }
.bnav-fab svg {
  width: 24px; height: 24px;
  stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round;
}

/* ─────────────────────────────────────────
   DRIVER REPORT — 4 full-screen quadrants
───────────────────────────────────────── */
.dr-screen {
  position: fixed; inset: 0; max-width: 390px; margin: 0 auto;
  z-index: 100;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.dr-screen.on { opacity: 1; pointer-events: all; }
.dr-q {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border: none; cursor: pointer; gap: 10px;
  transition: filter .12s;
}
.dr-q:active { filter: brightness(.88); }
.dr-q.po { background: #16a34a; }
.dr-q.pf { background: #dc2626; }
.dr-q.ts { background: #ea580c; }
.dr-q.tc { background: #2563eb; }
.dr-emoji { font-size: 50px; line-height: 1; }
.dr-label { color: #fff; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.dr-hint  { color: rgba(255,255,255,.65); font-size: 12px; }

.dr-close-btn {
  position: fixed; top: 18px; right: 18px; z-index: 110;
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(0,0,0,.28); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.dr-close-btn.on { opacity: 1; pointer-events: all; }
.dr-close-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* ── Submit flash ── */
.submit-flash {
  position: fixed; inset: 0; max-width: 390px; margin: 0 auto;
  z-index: 120;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.submit-flash.on { opacity: 1; }
.sf-bg { position: absolute; inset: 0; }
.sf-body { position: relative; text-align: center; padding: 0 28px; }
.sf-emoji { font-size: 68px; margin-bottom: 10px; }
.sf-title { color: #fff; font-size: 24px; font-weight: 900; }
.sf-sub   { color: rgba(255,255,255,.8); font-size: 14px; margin-top: 5px; line-height: 1.5; }

/* ── Receipt pill ── */
.receipt-pill {
  position: fixed;
  bottom: calc(var(--nav-h) + 12px);
  left: 50%; transform: translateX(-50%) translateY(0);
  z-index: 130;
  background: var(--c-ink); color: #fff;
  border-radius: 20px;
  padding: 10px 18px;
  font-size: 13px; font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.receipt-pill.on {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
}
.reject-pill {
  position: fixed;
  bottom: calc(var(--nav-h) + 12px);
  left: 50%; transform: translateX(-50%) translateY(0);
  z-index: 130;
  background: #7f1d1d; color: #fff;
  border-radius: 16px;
  padding: 12px 18px;
  font-size: 13px; font-weight: 600;
  white-space: normal; text-align: center; line-height: 1.4;
  width: calc(100% - 48px); max-width: 340px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.reject-pill.on {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
  pointer-events: auto;
}

/* ── Undo bar ── */
.undo-bar {
  position: fixed; top: 54px; left: 50%; transform: translateX(-50%);
  z-index: 130;
  background: var(--c-ink); border-radius: 14px;
  padding: 12px 18px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
  max-width: 340px; width: calc(100% - 40px);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.undo-bar.on { opacity: 1; pointer-events: all; }
.undo-text { color: #fff; font-size: 13px; font-weight: 500; flex: 1; }
.undo-btn  { color: #60a5fa; font-size: 13px; font-weight: 700; border: none; background: none; cursor: pointer; }

/* ─────────────────────────────────────────
   PARKING DETAIL SHEET
───────────────────────────────────────── */
.sheet-overlay {
  position: fixed; inset: 0; max-width: 390px; margin: 0 auto;
  background: rgba(0,0,0,.38); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.sheet-overlay.on { opacity: 1; pointer-events: all; }

.p-sheet {
  position: fixed; bottom: 0; left: 50%; max-width: 390px; width: 100%;
  max-height: 85vh; overflow-y: auto;
  transform: translate(-50%, 100%);
  background: #fff; border-radius: 24px 24px 0 0;
  z-index: 60;
  transition: transform .36s cubic-bezier(.32,.72,0,1);
  padding-bottom: 32px;
}
.p-sheet.on { transform: translate(-50%, 0); }

.ps-handle {
  width: 36px; height: 4px; background: #e5e7eb;
  border-radius: 2px; margin: 12px auto 0;
}
.ps-inner { padding: 16px 20px; }
.ps-name { font-size: 20px; font-weight: 800; color: var(--c-ink); }
.ps-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.ps-tag {
  font-size: 12px; font-weight: 600; padding: 3px 10px;
  border-radius: 20px; background: var(--c-bg); color: var(--c-sub);
}
.ps-tag.open   { background: #dcfce7; color: #15803d; }
.ps-tag.limited{ background: #fef9c3; color: #a16207; }
/* data-quality tier — deliberately NOT green/amber (those mean
   open/limited) so a "Likely" lot never reads as an availability
   signal. Likely is visibly weaker: flat gray vs. a confident blue. */
.ps-tag.tier-verified { background: #eff6ff; color: var(--c-blue); }
.ps-tag.tier-likely   { background: var(--c-bg); color: var(--c-sub); }
.p-card-tier {
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; flex-shrink: 0; margin-left: 4px;
}
.p-card-tier.tier-verified { background: #eff6ff; color: var(--c-blue); }
.p-card-tier.tier-likely   { background: var(--c-bg); color: var(--c-sub); }

/* recency badge — the freshness of the most recent crowd report, given
   the most visually prominent treatment on the sheet (not buried as a
   metadata row) since it's the single most decision-relevant fact in a
   crowdsourced-status product */
.ps-recency {
  display: none;
  align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700;
  margin-top: 10px; padding: 6px 10px;
  border-radius: 10px; width: fit-content;
}
.ps-recency.on { display: flex; }
.ps-recency-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ps-recency.fresh { background: #dcfce7; color: #15803d; }
.ps-recency.fresh .ps-recency-dot { background: #16a34a; }
.ps-recency.stale { background: #fef9c3; color: #a16207; }
.ps-recency.stale .ps-recency-dot { background: #d97706; }
.ps-recency.none  { background: var(--c-bg); color: var(--c-sub); font-weight: 600; }
.ps-recency.none  .ps-recency-dot { background: #9ca3af; }

/* big distance display */
.ps-dist-row {
  background: var(--c-bg); border-radius: 16px;
  padding: 14px 16px; margin-top: 14px;
  display: flex; align-items: center; gap: 14px;
}
.ps-dist-num {
  font-size: 38px; font-weight: 900; color: var(--c-ink);
  line-height: 1; letter-spacing: -.02em;
}
.ps-dist-detail {}
.ps-dist-unit { font-size: 14px; font-weight: 600; color: var(--c-sub); }
.ps-dist-dir  { font-size: 12px; color: #9ca3af; margin-top: 3px; }

/* info rows */
.ps-divider { height: 1px; background: var(--c-border); margin: 14px 0; }
.ps-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--c-border);
}
.ps-row:last-of-type { border: none; }
.ps-row label { font-size: 14px; color: var(--c-sub); }
.ps-row span  { font-size: 14px; font-weight: 600; color: var(--c-ink); text-align: right; max-width: 60%; }

/* action buttons */
.ps-actions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-top: 14px;
}
.ps-action {
  height: 50px; border: none; border-radius: 14px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: opacity .15s;
}
.ps-action:active { opacity: .85; }
.ps-action.open-btn { background: #dcfce7; color: #15803d; }
.ps-action.full-btn { background: #fee2e2; color: var(--c-red); }

.ps-directions {
  width: 100%; height: 50px; border: none; border-radius: 14px;

  background: var(--c-blue); color: #fff;

.ps-directions svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>

  zoomControl: false, attributionControl: true,
  dragging: true, tap: true,
}).setView([userLat, userLon], 15.5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, subdomains: 'abcd',
  attribution: '© CARTO'
}).addTo(map);

function haversine(a, b, c, d) {
  const R = 6371000, dL = (c-a)*Math.PI/180, dN = (d-b)*Math.PI/180;
  const x = Math.sin(dL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x)));
}
// urban driving ~20 km/h = 333 m/min; minimum 1 min — fallback used until
// (or unless) a real drive time comes back from refreshDriveMinutes()
function driveMins(metres) { return Math.max(1, Math.ceil(metres / 333)); }
// walking ~80 m/min; minimum 1 min
function walkMins(metres) { return Math.max(1, Math.ceil(metres / 80)); }

// ─── REAL DRIVE TIMES (Google Routes API) ────────────────────
// Fetches actual traffic-aware driving durations for a batch of spots in
// one request, keyed by spot id. Batched (not per-spot) to stay within
// the API's per-request waypoint limit and keep quota usage sane.
async function fetchDriveMinutesMap(originLat, originLon, destSpots) {
  const BATCH = 25;
  const out = new Map();
  const batches = [];
  for (let i = 0; i < destSpots.length; i += BATCH) batches.push(destSpots.slice(i, i + BATCH));

  await Promise.all(batches.map(async batch => {
    try {
      const res = await fetch(ROUTE_MATRIX_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': GOOGLE_PLACES_API_KEY,
          'X-Goog-FieldMask': 'originIndex,destinationIndex,duration,condition',
        },
        body: JSON.stringify({
          origins: [{ waypoint: { location: { latLng: { latitude: originLat, longitude: originLon } } } }],
          destinations: batch.map(s => ({ waypoint: { location: { latLng: { latitude: s.lat, longitude: s.lon } } } })),
          travelMode: 'DRIVE',
          routingPreference: 'TRAFFIC_AWARE',
        }),
        signal: AbortSignal.timeout(6000),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const elements = await res.json();
      (elements || []).forEach(el => {
        if (el.condition !== 'ROUTE_EXISTS' || !el.duration) return;
        const seconds = parseInt(el.duration, 10); // e.g. "615s" -> 615
        if (!Number.isFinite(seconds)) return;
        const spot = batch[el.destinationIndex];
        if (spot) out.set(spot.id, Math.max(1, Math.ceil(seconds / 60)));
      });
    } catch (e) {
      console.warn('Routes API unavailable, using distance-based estimate:', e.message);
    }
  }));
  return out;
}

// fetches real drive times for the given spots and stores them on
// `realDriveMins`; also patches the sheet's number directly in case it's
// open on a spot mid-fetch (the caller handles re-sorting/redrawing cards).
// `expectedGen`, when passed, discards the whole result if a newer
// renderAll() has started in the meantime — otherwise a slow fetch from
// a stale (e.g. fallback-location) origin could overwrite spots' real
// drive times with numbers computed from the wrong starting point.
async function refreshDriveMinutes(originLat, originLon, spotsArr, expectedGen) {
  const realMins = await fetchDriveMinutesMap(originLat, originLon, spotsArr);
  if (expectedGen != null && expectedGen !== _renderGen) return;
  realMins.forEach((mins, id) => {
    const s = spotsArr.find(sp => sp.id === id);
    if (s) s.realDriveMins = mins;
    if (activeSpot && activeSpot.id === id) {
      const psEl = document.getElementById('psDist');
      if (psEl) psEl.textContent = mins;
    }
  });
}

function bearing(a, b, c, d) {
  const dl = (d-b)*Math.PI/180,
    y = Math.sin(dl)*Math.cos(c*Math.PI/180),
    x = Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180) - Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dl),
    br = (Math.atan2(y,x)*180/Math.PI + 360) % 360;
  if (br<22.5||br>=337.5) return '↑ ahead';
  if (br<67.5)  return '↗ ahead-right';
  if (br<112.5) return '→ right';
  if (br<157.5) return '↘ back-right';
  if (br<202.5) return '↓ behind';
  if (br<247.5) return '↙ back-left';
  if (br<292.5) return '← left';
  return '↖ ahead-left';
}

// ─── RESTRICTIONS (Mumbai Traffic Police no-parking / odd-even zones) ────
let restrictions = [];
let restrictionLayers = [];
const RESTRICTION_ALERT_METRES = 60;

function notificationYear(notification) {
  if (!notification) return null;
  const m = String(notification).match(/\b(20\d{2})\b(?!.*\b20\d{2}\b)/);
  return m ? parseInt(m[1], 10) : null;
}

async function loadRestrictions() {
  try {
    const res = await fetch('./data/restrictions.geojson');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geo = await res.json();
    const thisYear = new Date().getFullYear();
    restrictions = (geo.features || []).filter(f => {
      const p = f.properties;
      if (p.permanence !== 'temporary') return true;
      const yr = notificationYear(p.notification);
      return yr === null || yr >= thisYear - 1;
    });
    renderRestrictions();
    console.log(`Loaded ${restrictions.length} restriction segments`);
  } catch (err) {
    console.warn('Could not load restrictions:', err.message);
  }
}

// halfway point along a LineString by cumulative distance (not just array index)
function lineMidpoint(coords) {
  const segLens = [];
  let total = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const d = haversine(coords[i][1], coords[i][0], coords[i+1][1], coords[i+1][0]);
    segLens.push(d);
    total += d;
  }
  let target = total / 2, acc = 0;
  for (let i = 0; i < segLens.length; i++) {
    if (acc + segLens[i] >= target || i === segLens.length - 1) {
      const t = segLens[i] === 0 ? 0 : (target - acc) / segLens[i];
      const [lon1, lat1] = coords[i], [lon2, lat2] = coords[i+1];
      return [lat1 + (lat2-lat1)*t, lon1 + (lon2-lon1)*t];
    }
    acc += segLens[i];
  }
  const last = coords[coords.length - 1];
  return [last[1], last[0]];
}

function renderRestrictions() {
  restrictionLayers.forEach(l => map.removeLayer(l));
  restrictionLayers = [];

  restrictions.forEach(f => {
    const coords = f.geometry.coordinates; // [[lon,lat], ...]
    const latlngs = coords.map(([lon, lat]) => [lat, lon]);
    const p = f.properties;
    const fuzzy = p.match_confidence && p.match_confidence !== 'exact';

    const line = L.polyline(latlngs, {
      color: '#dc2626',
      weight: 4,
      opacity: fuzzy ? 0.45 : 0.65,
      dashArray: p.permanence === 'temporary' ? '6 6' : null,
    }).addTo(map);
    line.bindPopup(`
      <strong>${p.type}</strong><br>
      ${p.division} &middot; ${p.permanence}<br>
      ${p.pdf_url ? `<a href="${p.pdf_url}" target="_blank" rel="noopener">View notification</a>` : 'Notification: ' + p.notification}
      ${fuzzy ? `<br><em style="color:#9ca3af">⚠ fuzzy match — location approximate</em>` : ''}
    `);
    restrictionLayers.push(line);

    if (coords.length >= 2) {
      const [mlat, mlon] = lineMidpoint(coords);
      const marker = L.marker([mlat, mlon], { icon: mkCautionIcon() }).addTo(map);
      marker.on('click', () => line.openPopup());
      restrictionLayers.push(marker);
    }
  });

  checkRestrictionProximity(userLat, userLon);
}

// shortest distance from a point to a lat/lng segment (equirectangular approx, fine at city scale)
function pointToSegmentMeters(plat, plon, alat, alon, blat, blon) {
  const R = 6371000;
  const latRef = (alat + blat) / 2 * Math.PI / 180;
  const toXY = (lat, lon) => [(lon * Math.PI/180) * Math.cos(latRef) * R, (lat * Math.PI/180) * R];
  const [px, py] = toXY(plat, plon);
  const [ax, ay] = toXY(alat, alon);
  const [bx, by] = toXY(blat, blon);
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq === 0 ? 0 : ((px-ax)*dx + (py-ay)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.sqrt((px-cx)**2 + (py-cy)**2);
}

function checkRestrictionProximity(lat, lon) {
  let nearest = null, nearestDist = Infinity;
  restrictions.forEach(f => {
    const coords = f.geometry.coordinates;
    for (let i = 0; i < coords.length - 1; i++) {
      const [lon1, lat1] = coords[i], [lon2, lat2] = coords[i+1];
      const d = pointToSegmentMeters(lat, lon, lat1, lon1, lat2, lon2);
      if (d < nearestDist) { nearestDist = d; nearest = f; }
    }
  });

  const banner = document.getElementById('restrictionBanner');
  if (nearest && nearestDist <= RESTRICTION_ALERT_METRES) {
    document.getElementById('restrictionBannerSub').textContent =
      `${nearest.properties.type} · ${nearest.properties.division} · ${Math.round(nearestDist)}m away`;
    banner.classList.add('on');
  } else {
    banner.classList.remove('on');
  }
}

// draws pins + cards for an already-sorted spot list — called twice per
// location update: once immediately (sorted by straight-line estimate)
// and again once real drive times come back (sorted by those instead)
function renderSpotsUI(sorted) {
  spotMarkers.forEach(m => map.removeLayer(m));
  spotMarkers = [];

  sorted.forEach((s, i) => {
    const m = L.marker([s.lat, s.lon], {
      icon: mkPinIcon(s.cls, i === 0, false),
      zIndexOffset: i === 0 ? 100 : 0,
    }).addTo(map);
    m.on('click', () => openSpot(s));
    spotMarkers.push(m);
  });

  // user
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([userLat, userLon], {
    icon: mkUserIcon(), zIndexOffset: -100,
  }).addTo(map);

  // cards
  document.getElementById('cardsStrip').innerHTML = sorted.map((s, i) => {
    const mins = s.realDriveMins != null ? s.realDriveMins : driveMins(s.dist);
    const tier = tierBadge(s);
    return `
    <div class="p-card" onclick="openSpotById(${s.id})">
      <div class="p-card-top">
        <div class="p-card-name">${s.name}</div>

        ${tier ? `<span class="p-card-tier ${tier.cls}">${tier.label}</span>` : ''}
      </div>

        <span class="p-card-dist"><span id="pcd-${s.id}">${mins}</span><span class="unit-min"> min drive ${s.dir.split(' ')[0]}</span></span>
      </div>

    </div>
  `;
  }).join('');

  checkRestrictionProximity(userLat, userLon);
}

// renderAll() runs once immediately with a fallback location, then again
// once real GPS resolves — this counter lets a newer call discard an
// older call's async drive-time results instead of racing to overwrite
// each other with numbers computed from the wrong origin
let _renderGen = 0;
function renderAll() {
  const myGen = ++_renderGen;
  const vs = visible();
  vs.forEach(s => {
    s.dist = haversine(userLat, userLon, s.lat, s.lon);
    s.dir  = bearing(userLat, userLon, s.lat, s.lon);
  });
  const sorted = [...vs].sort((a,b) => a.dist - b.dist);
  renderSpotsUI(sorted);

  // once real drive times are in, re-sort and redraw by actual time
  // instead of straight-line distance — but only if no newer renderAll()
  // call (e.g. locateUser() resolving) has superseded this one
  refreshDriveMinutes(userLat, userLon, sorted, myGen).then(() => {
    if (myGen !== _renderGen) return;
    const byDriveTime = [...sorted].sort((a, b) =>
      (a.realDriveMins != null ? a.realDriveMins : driveMins(a.dist)) -
      (b.realDriveMins != null ? b.realDriveMins : driveMins(b.dist))
    );
    renderSpotsUI(byDriveTime);
  });
}

// ─── GEOLOCATION ─────────────────────────────────────────────
function locateUser() {
  if (!navigator.geolocation) { renderAll(); return; }
  navigator.geolocation.getCurrentPosition(p => {
    userLat = p.coords.latitude;
    userLon = p.coords.longitude;
    map.setView([userLat, userLon], 16, { animate: true });
    renderAll();
  }, () => renderAll(), { enableHighAccuracy: true, timeout: 8000 });
}

// Shared Google Places lookup used by both the home search bar
// (autocomplete only) and the results-screen search bar (re-search).
async function fetchPlaces(q) {
  try {
    const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_PLACES_API_KEY,
        'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.location',
      },
      body: JSON.stringify({
        textQuery: q,
        locationBias: {
          circle: { center: { latitude: 19.0760, longitude: 72.8777 }, radius: 50000 },
        },
        regionCode: 'IN',
      }),
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.places || [];
  } catch (e) { return []; }
}
// Safely HTML-escapes untrusted text (e.g. Google Places results) before
// it's interpolated into innerHTML — a malicious business listing name
// must never be able to inject markup/script.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// 1.2km ≈ 15 min walk at 80 m/min (matches walkMins' own constant) — a
// single named ceiling, not two separate distance/time thresholds
const WALK_CEILING_M = 1200;
const SEARCH_RESULTS_CAP = 5;

// walk-distance filter + sort + cap — free and local. Drive time (ETA)
// is only ever requested for whatever survives this, never for all 176.
// The empty-result rate matters from day one (decision: designed
// feature, not a failure), so every call logs its result count.
function nearbySearchCandidates(lat, lon, searchTerm) {
  const candidates = visible()
    .map(s => ({ ...s, _walkDist: haversine(lat, lon, s.lat, s.lon) }))
    .filter(s => s._walkDist <= WALK_CEILING_M)
    .sort((a, b) => a._walkDist - b._walkDist)
    .slice(0, SEARCH_RESULTS_CAP);
  logEvent('search_performed', { term: searchTerm, resultsReturned: candidates.length });
  return candidates;
}

// fetches real drive times for the capped candidate list and calls
// onUpdate(id, mins) per spot once resolved — shared by both search
// result screens so drive-time patching logic isn't duplicated
async function patchSearchDriveTimes(lat, lon, candidates, onUpdate) {
  if (!candidates.length) return;
  const realMins = await fetchDriveMinutesMap(lat, lon, candidates);
  realMins.forEach((mins, id) => onUpdate(id, mins));
}

// desktop search results: walk-filtered, capped at 5, drive-time priced

  container.innerHTML = candidates.map(cardHtml).join('');

  flash.classList.add('on');
  setTimeout(() => {
    flash.classList.remove('on');
    showReceiptPill();
    const bar = document.getElementById('undoBar');
    document.getElementById('undoText').textContent = 'Reported: ' + type;
    bar.classList.add('on');
    bar._t = setTimeout(() => bar.classList.remove('on'), 4000);
  }, 950);
}

function showRejectPill(message) {
  const pill = document.getElementById('rejectPill');
  pill.textContent = message;
  pill.classList.add('on');
  setTimeout(() => pill.classList.remove('on'), 3500);
}

async function submitReport(type) {
  closeReport();
  switchTab('map');

  // drop a highlighted pin at user location — purely visual, independent
  // of whether the report itself ends up persisted
  const rPin = L.marker([userLat, userLon], {
    icon: mkPinIcon('green', false, true),
    zIndexOffset: 200,
  }).addTo(map);
  map.setView([userLat, userLon], 16, { animate: true });
  setTimeout(() => map.removeLayer(rPin), 90000);

  const meta = REPORT_META[type];

  if (meta.status == null) {
    // Tow Spotted / Tow Cleared: never persisted, so never claim
    // "other drivers can see this" — that would be false every time
    showReportFlash(type, 'Shown on your map only — not sent to other drivers yet');
    return;
  }

  const { spot, dist } = nearestSpotTo(userLat, userLon);
  if (!spot || dist > NEARBY_SPOT_THRESHOLD_M) {
    showRejectPill('Too far from a known spot to report — pick the right one?');
    openSpotPicker(type);
    return;
  }

  const ok = await postSpotReport(spot.id, meta.status);
  if (ok) {
    showReportFlash(type, 'Other drivers can see this now');
  } else {
    showRejectPill('Report failed to send — try again in a moment');
  }
}
function undoReport() {
  const bar = document.getElementById('undoBar');
  clearTimeout(bar._t);
  bar.classList.remove('on');
}

// fallback UI when a report can't be auto-matched to a nearby spot —
// never drop the report silently, let the user pick which spot they mean
let pendingReportType = null;
function openSpotPicker(type) {
  pendingReportType = type;
  const nearby = [...spots]
    .map(s => ({ ...s, _d: haversine(userLat, userLon, s.lat, s.lon) }))
    .sort((a, b) => a._d - b._d)
    .slice(0, 8);
  document.getElementById('pickerList').innerHTML = nearby.map(s => `
    <div class="rl-card" onclick="pickSpotForReport(${s.id})">
      <div class="rl-card-badge" style="color:${s.status === 'open' ? 'var(--c-green)' : 'var(--c-yellow)'}">P</div>
      <div class="rl-card-body">
        <div class="rl-card-name">${s.name}</div>
        <div class="rl-card-meta">${Math.round(s._d)}m away</div>
      </div>
    </div>
  `).join('');
  document.getElementById('pickerOverlay').classList.add('on');
  document.getElementById('pickerSheet').classList.add('on');
}
function closeSpotPicker() {
  document.getElementById('pickerOverlay').classList.remove('on');
  document.getElementById('pickerSheet').classList.remove('on');
  pendingReportType = null;
}
async function pickSpotForReport(spotId) {
  const type = pendingReportType;
  closeSpotPicker();
  if (!type) return;
  const meta = REPORT_META[type];
  const ok = await postSpotReport(spotId, meta.status);
  if (ok) showReportFlash(type, 'Other drivers can see this now');
  else showRejectPill('Report failed to send — try again in a moment');
}

// data-quality badge — separate from availability (open/limited) on
// purpose, so a well-sourced-but-unconfirmed lot is never mistaken for
// a live status signal
function tierBadge(s) {
  if (s.confidenceTier === 'VERIFIED') return { cls: 'tier-verified', label: 'Verified' };
  if (s.confidenceTier === 'LIKELY') return { cls: 'tier-likely', label: 'Likely' };
  return null;
}

// ─── PARKING SHEET ───────────────────────────────────────────
let activeSpot = null;
function openSpotById(id) { openSpot(spots.find(s => s.id === id)); }
// buckets a spot's most recent crowd report into fresh (<=5min, assert)
// / stale (<=30min, hedge) / none (no report in the freshness window —
// spot_current_status already falls back to seed status at that point)
function recencyInfo(s) {
  const statusLabel = s.status === 'open' ? 'Open' : 'Limited';
  if (!s.isLiveReported || !s.lastReportedAt) {
    return { band: 'none', text: 'No recent reports' };
  }
  const ageMin = Math.max(0, Math.round((Date.now() - new Date(s.lastReportedAt).getTime()) / 60000));
  const ageText = ageMin < 1 ? 'just now' : `${ageMin} min ago`;
  if (ageMin <= 5) return { band: 'fresh', text: `${statusLabel} · reported ${ageText}` };
  return { band: 'stale', text: `${statusLabel} · reported ${ageText} — may have changed` };
}

function openSpot(s) {
  if (!s) return;
  activeSpot = s;
  document.getElementById('psName').textContent = s.name;
  document.getElementById('psHours').textContent = s.hours;
  document.getElementById('psPay').textContent   = s.pay;
  document.getElementById('psType').textContent  = s.type;
  document.getElementById('psConf').textContent  = s.conf;
  document.getElementById('psDist').textContent  = s.realDriveMins != null ? s.realDriveMins : driveMins(s.dist);
  document.getElementById('psDir').textContent   = s.dir || '';
  const tier = tierBadge(s);
  document.getElementById('psTags').innerHTML =
    `<span class="ps-tag ${s.status}">${s.status === 'open' ? 'Open' : 'Limited'}</span>` +
    `<span class="ps-tag">${s.type}</span>` +
    (tier ? `<span class="ps-tag ${tier.cls}">${tier.label}</span>` : '');
  const recency = recencyInfo(s);
  const recEl = document.getElementById('psRecency');
  recEl.className = `ps-recency on ${recency.band}`;
  recEl.innerHTML = `<span class="ps-recency-dot"></span>${recency.text}`;
  document.getElementById('sheetOverlay').classList.add('on');
  document.getElementById('pSheet').classList.add('on');
}
function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('on');
  document.getElementById('pSheet').classList.remove('on');
  activeSpot = null;
}
function markSpot(action) {
  if (!activeSpot) return;
  const s = spots.find(x => x.id === activeSpot.id);
  const status = action === 'open' ? 'open' : 'limited';
  if (s) {
    s.status = status;
    s.cls    = status === 'open' ? 'green' : 'yellow';
    s.conf   = 'Just now · you';
    s.isLiveReported = true;
    s.lastReportedAt = new Date().toISOString();
    postSpotReport(s.id, status);
  }
  closeSheet();
  renderAll();
}

// builds a "start navigation" link (not just a place link) —
// dir_action=navigate drops straight into turn-by-turn on the Maps app
function directionsUrl(lat, lon) {
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving&dir_action=navigate`;
}

function openInGoogleMaps() {
  if (!activeSpot) return;
  window.open(directionsUrl(activeSpot.lat, activeSpot.lon), '_blank', 'noopener');
}

// ─── RECEIPT PILL ────────────────────────────────────────────
function showReceiptPill() {
  const pill = document.getElementById('receiptPill');
  pill.textContent = 'Reported — thanks for helping other drivers';
  pill.classList.add('on');
  setTimeout(() => pill.classList.remove('on'), 2500);
}

// ─── INIT ────────────────────────────────────────────────────
async function fetchLiveStatuses() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/spot_current_status?select=spot_id,status,last_reported_at,is_live_reported`,
      { headers: { 'apikey': SUPABASE_ANON_KEY }, signal: AbortSignal.timeout(5000) }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    return new Map(rows.map(r => [r.spot_id, r]));
  } catch (e) {
    console.warn('Live status unavailable, using seed status:', e.message);
    return new Map();
  }
}

async function initApp() {
  spots = FALLBACK_SPOTS;
  const liveStatuses = await fetchLiveStatuses();
  spots.forEach(s => {
    const live = liveStatuses.get(s.id);
    if (live) {
      s.status = live.status;
      s.cls    = live.status === 'open' ? 'green' : 'yellow';
      s.isLiveReported = live.is_live_reported;
      s.lastReportedAt = live.last_reported_at;
    }
    s.dist = haversine(userLat, userLon, s.lat, s.lon);
    s.dir  = bearing(userLat, userLon, s.lat, s.lon);
  });
  renderAll();
  locateUser();
  loadRestrictions();
}
initApp();
</script>
