<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Curbside</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ─────────────────────────────────────────
   RESET & ROOT
───────────────────────────────────────── */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --c-green:  #16a34a;
  --c-yellow: #d97706;
  --c-red:    #dc2626;
  --c-blue:   #2563eb;
  --c-ink:    #111827;
  --c-sub:    #6b7280;
  --c-border: #f1f5f9;
  --c-bg:     #f8fafc;
  --nav-h:    68px;
  --r-card:   18px;
  --r-sheet:  24px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.07), 0 6px 20px rgba(0,0,0,.09);
  --shadow-sheet: 0 -4px 32px rgba(0,0,0,.12);
}

/* ── BODY ── */
html { height: 100%; background: var(--c-bg); }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--c-bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* On wide screens: sidebar panel left, map right */
@media (min-width: 768px) {
  :root { --panel-w: 380px; }

  /* map fills the whole viewport; panel sits on top-left */
  #map, #resultsMap { position: absolute; inset: 0; }

  /* screens are full-viewport, no column stacking */
  .screen { position: absolute; inset: 0; }

  /* ── map screen: panel strip on left, map behind ── */
  #map-screen .map-top {
    top: 0; left: 0; width: var(--panel-w);
    padding: 20px 14px 0;
    z-index: 15;
  }
  #map-screen .search-results {
    position: absolute; top: calc(20px + 48px + 8px);
    left: 14px; right: 14px; width: auto;
  }
  .map-legend {
    bottom: calc(var(--nav-h) + 10px); left: calc(var(--panel-w) + 14px);
  }
  .map-locate {
    bottom: calc(var(--nav-h) + 10px); right: 14px;
  }
  .cards-strip {
    position: absolute;
    top: 120px; left: 0;
    bottom: var(--nav-h);
    width: var(--panel-w);
    flex-direction: column;
    overflow-x: hidden; overflow-y: auto;
    padding: 0 14px 14px;
    gap: 10px;
    scroll-snap-type: none;
    /* frosted panel */
    background: rgba(248,250,252,.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-right: 1px solid #e5e7eb;
  }
  .p-card { width: 100%; }
  .bnav {
    left: 0; width: var(--panel-w);
    border-right: 1px solid #e5e7eb;
  }

  /* sheet and overlay: constrained to panel width */
  .sheet-overlay { right: auto; width: var(--panel-w); }
  .p-sheet {
    left: 0; right: auto; width: var(--panel-w);
    transform: translateY(100%);
    border-radius: 24px 24px 0 0;
  }
  .p-sheet.on { transform: translateY(0); }

  /* results screen: list panel left, map right */
  #results-screen { flex-direction: row; }
  .results-header {
    position: absolute; top: 0; left: 0; width: var(--panel-w);
    padding: 20px 14px 12px;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    z-index: 20;
  }
  .results-header .search-results {
    position: absolute; top: 100%; left: 14px; right: 14px; width: auto; margin-top: 4px;
  }
  .results-body { flex: 1; display: flex; flex-direction: row; }
  .results-map-half {
    position: absolute;
    top: 0; left: var(--panel-w); right: 0; bottom: 0;
    flex: none;
  }
  .results-list-half {
    position: absolute;
    top: 80px; left: 0; width: var(--panel-w); bottom: 0;
    border-radius: 0; margin-top: 0;
    border-right: 1px solid #e5e7eb;
    box-shadow: none;
    overflow-y: auto;
  }
  .results-list-handle { display: none; }
}

/* ─────────────────────────────────────────
   SCREENS
───────────────────────────────────────── */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ─────────────────────────────────────────
   MAP SCREEN
───────────────────────────────────────── */
#map {
  position: absolute; inset: 0; z-index: 0;
}
.leaflet-tile {
  filter: hue-rotate(168deg) saturate(.35) brightness(1.07) contrast(.9);
}
.leaflet-container { background: #d4e8ef; }
.leaflet-attribution-flag { display: none !important; }
.leaflet-control-attribution {
  font-size: 9px; background: rgba(255,255,255,.6) !important;
  border-radius: 6px 0 0 0;
}

/* ── TOP: search + zone pill ── */
.map-top {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 10; padding: 52px 14px 0;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}

.search-bar {
  background: #fff;
  border-radius: 16px;
  padding: 0 14px;
  height: 48px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow-card);
  pointer-events: all;
  overflow: hidden;
}
.search-bar svg {
  width: 17px; height: 17px;
  stroke: var(--c-sub); fill: none; stroke-width: 2;
  flex-shrink: 0;
}
.search-input {
  flex: 1; border: none; outline: none;
  font-size: 15px; font-weight: 500; color: var(--c-ink);
  background: none; font-family: inherit;
  min-width: 0;
}
.search-input::placeholder { color: #9ca3af; }
.search-clear {
  background: none; border: none; cursor: pointer;
  color: #9ca3af; font-size: 20px; line-height: 1;
  display: none; padding: 4px; flex-shrink: 0;
}
.search-results {
  display: none;
  position: absolute; top: calc(52px + 48px + 8px);
  left: 14px; right: 14px;
  background: #fff; border-radius: 14px;
  box-shadow: var(--shadow-card);
  overflow: hidden; z-index: 20;
  pointer-events: all;
}
.sri {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer; transition: background .1s;
}
.sri:last-child { border: none; }
.sri:active { background: var(--c-bg); }
.sri-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--c-bg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sri-icon svg { width: 14px; height: 14px; stroke: var(--c-sub); fill: none; stroke-width: 2; }
.sri-text {}
.sri-main { font-size: 14px; font-weight: 600; color: var(--c-ink); }
.sri-sub  { font-size: 12px; color: var(--c-sub); margin-top: 1px; }


/* ── RESTRICTION CAUTION BANNER ── */
.restriction-banner {
  display: flex; align-items: center; gap: 10px;
  background: #fff5f5; border: 1.5px solid #fecaca;
  border-radius: 16px;
  padding: 10px 14px;
  box-shadow: var(--shadow-card);
  pointer-events: all;
  max-width: 100%;
  opacity: 0; transform: translateY(-6px);
  transition: opacity .25s ease, transform .25s ease;
}
.restriction-banner.on { opacity: 1; transform: translateY(0); }
.restriction-banner-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-red); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900;
}
.restriction-banner-text { min-width: 0; }
.restriction-banner-title { font-size: 13px; font-weight: 800; color: #7f1d1d; }
.restriction-banner-sub {
  font-size: 12px; color: #991b1b; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── RESULTS SCREEN (full-screen search results: map top / list bottom) ── */
#results-screen { background: #fff; }
.results-header {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 52px 14px 12px;
  background: #fff;
  position: relative; z-index: 20;
}
.results-back-btn {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-bg); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.results-back-btn svg { width: 20px; height: 20px; stroke: var(--c-ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.results-header .search-bar { flex: 1; }
.results-header .search-results {
  position: absolute; top: 100%; left: 64px; right: 14px;
  margin-top: 6px;
}
.results-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.results-map-half { flex: 1; position: relative; min-height: 0; }
.results-map-half #resultsMap { position: absolute; inset: 0; }
.results-list-half {
  flex: 1; min-height: 0; overflow-y: auto;
  background: #fff;
  border-radius: 20px 20px 0 0;
  margin-top: -16px; position: relative; z-index: 5;
  box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  padding-bottom: 20px;
}
.results-list-handle { width: 36px; height: 4px; background: #e5e7eb; border-radius: 2px; margin: 10px auto 4px; }
.results-location-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px 12px;
  border-bottom: 1px solid var(--c-border);
}
.results-location-icon {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-ink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.results-location-name { font-size: 15px; font-weight: 800; color: var(--c-ink); }
.results-location-sub { font-size: 12px; color: var(--c-sub); margin-top: 1px; }
.rl-card {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer; transition: background .12s;
}
.rl-card:last-child { border: none; }
.rl-card:active, .rl-card.active { background: var(--c-bg); }
/* badge matches the real map pin: white fill, colored ring + letter — not a solid color dot */
.rl-card-badge {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  border: 2.5px solid currentColor;
  box-shadow: 0 1px 4px rgba(0,0,0,.15);
}
.rl-card-body { flex: 1; min-width: 0; }
.rl-card-name { font-size: 14px; font-weight: 700; color: var(--c-ink); }
.rl-card-meta { font-size: 12px; color: var(--c-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rl-card-dist { flex-shrink: 0; text-align: right; }
.rl-card-dist-num { font-size: 16px; font-weight: 900; color: var(--c-ink); }
.rl-card-dist-unit { font-size: 11px; color: var(--c-sub); }
/* neutral (not colored) directions shortcut — colour is reserved for the active/tapped state */
.rl-card-directions {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: var(--c-ink); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.rl-card-directions svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.rl-empty { padding: 40px 24px; text-align: center; color: var(--c-sub); font-size: 14px; }

/* ── MAP EXTRAS ── */
.map-locate {
  position: absolute; z-index: 10;
  bottom: calc(var(--nav-h) + 126px); right: 14px;
  width: 40px; height: 40px; border-radius: 50%;
  background: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-card);
}
.map-locate svg { width: 18px; height: 18px; stroke: var(--c-blue); fill: none; stroke-width: 2; }

.map-legend {
  position: absolute; z-index: 10;
  bottom: calc(var(--nav-h) + 126px); left: 14px;
  background: #fff; border-radius: 20px;
  padding: 6px 12px;
  display: flex; gap: 12px;
  box-shadow: var(--shadow-card);
  font-size: 11px; font-weight: 600; color: var(--c-ink);
}
.leg { display: flex; align-items: center; gap: 4px; }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── PARKING CARDS (bottom strip) ── */
.cards-strip {
  position: absolute; z-index: 10;
  bottom: calc(var(--nav-h) + 10px);
  left: 0; right: 0;
  display: flex; gap: 10px;
  padding: 0 14px;
  overflow-x: auto; overflow-y: visible;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.cards-strip::-webkit-scrollbar { display: none; }

.p-card {
  flex-shrink: 0; width: 220px;
  background: #fff; border-radius: var(--r-card);
  padding: 14px;
  box-shadow: var(--shadow-card);
  scroll-snap-align: start;
  cursor: pointer;
  transition: transform .15s;
}
.p-card:active { transform: scale(.97); }
.p-card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px;
  margin-bottom: 8px;
}
.p-card-name {
  font-size: 13px; font-weight: 700; color: var(--c-ink);
  line-height: 1.3; flex: 1;
}
.p-card-badge {
  font-size: 11px; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; flex-shrink: 0;
}
.p-card-badge.open   { background: #dcfce7; color: #15803d; }
.p-card-badge.limited{ background: #fef9c3; color: #a16207; }
.p-card-dist {
  font-size: 28px; font-weight: 900; color: var(--c-ink);
  letter-spacing: -.02em; line-height: 1;
}
.p-card-dist span { font-size: 13px; font-weight: 600; color: var(--c-sub); margin-left: 2px; }
.p-card-dist .unit-min { font-size: 13px; font-weight: 600; color: var(--c-sub); margin-left: 2px; }
.p-card-meta {
  font-size: 11px; color: var(--c-sub); margin-top: 5px;
  display: flex; align-items: center; gap: 4px;
}
.p-card-meta strong { color: var(--c-ink); font-weight: 700; }

/* ── MAP PINS ── */
.pin-wrap {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; user-select: none;
}
.pin-circle {
  width: 40px; height: 40px; border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
  border: 2.5px solid currentColor;
  position: relative;
}
.pin-circle::after {
  content: '';
  position: absolute; bottom: -7px; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: currentColor;
  border-bottom: none;
}
.pin-wrap.green  .pin-circle { color: var(--c-green); }
.pin-wrap.yellow .pin-circle { color: var(--c-yellow); }
.pin-wrap.tow    .pin-circle { color: var(--c-red); background: #fff5f5; }
.pin-wrap.me     .pin-circle { color: var(--c-blue); background: #eff6ff; border-width: 3px; }
.pin-wrap.rpt    .pin-circle {
  color: var(--c-blue); background: #eff6ff;
  animation: pin-pulse 1.2s ease-in-out 4;
}
@keyframes pin-pulse {
  0%,100% { box-shadow: 0 2px 8px rgba(37,99,235,.3); }
  50%      { box-shadow: 0 2px 20px rgba(37,99,235,.7); }
}
.pin-nearest-label {
  background: var(--c-blue); color: #fff;
  font-size: 9px; font-weight: 800;
  padding: 2px 6px; border-radius: 6px;
  margin-top: 4px; white-space: nowrap;
  letter-spacing: .04em;
  box-shadow: 0 1px 4px rgba(37,99,235,.4);
}

/* caution pin for restriction segments (smaller, sits on the road line) */
.pin-caution {
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(220,38,38,.45);
  border: 3px solid var(--c-red);
  cursor: pointer;
  position: relative;
}
.pin-caution::after {
  content: '';
  position: absolute;
  width: 24px; height: 3px;
  background: var(--c-red);
  transform: rotate(-45deg);
}
/* user dot (no circle/tail) */
.user-dot {
  width: 72px; height: 72px; border-radius: 50%;
  background: rgba(37,99,235,.12);
  display: flex; align-items: center; justify-content: center;
}
.user-dot-inner {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--c-blue); border: 3px solid #fff;
  box-shadow: 0 0 0 4px rgba(37,99,235,.25);
}

/* ─────────────────────────────────────────
   BOTTOM NAV (shared)
───────────────────────────────────────── */
.bnav {
  position: absolute; bottom: 0; left: 0; right: 0;
  z-index: 20;
  height: var(--nav-h);
  background: #fff;
  border-top: 1px solid #e5e7eb;
  display: flex; align-items: center;
  padding: 0 4px env(safe-area-inset-bottom, 0);
}
.bnav-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; height: 100%;
  border: none; background: none; cursor: pointer;
  padding-bottom: 4px;
}
.bnav-tab svg {
  width: 22px; height: 22px;
  stroke: #9ca3af; fill: none; stroke-width: 1.75;
  transition: stroke .2s;
}
.bnav-tab .nt {
  font-size: 10px; font-weight: 700;
  color: #9ca3af; letter-spacing: .03em;
  text-transform: uppercase; transition: color .2s;
}
.bnav-tab.on svg  { stroke: var(--c-blue); }
.bnav-tab.on .nt  { color: var(--c-blue); }

/* Report FAB — 60px visual, 72px tap target */
.bnav-fab {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--c-red);
  box-shadow: 0 4px 16px rgba(220,38,38,.45);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin: 0 6px;
  transition: transform .12s;
  position: relative; top: -6px;
  /* extend tap target 6px beyond visual circle on all sides */
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.bnav-fab::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
}
.bnav-fab:active { transform: scale(.91); }
.bnav-fab svg {
  width: 24px; height: 24px;
  stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round;
}

/* ─────────────────────────────────────────
   TOW RADAR SCREEN
───────────────────────────────────────── */
#tow-screen { background: var(--c-bg); overflow: hidden; }

.tow-header {
  flex-shrink: 0;
  padding: 52px 20px 22px;
  transition: background .4s;
}
.tow-header.amber  { background: #fef9e7; }
.tow-header.clear  { background: #f0fdf4; }
.tow-header.danger { background: #fff5f5; }

.tow-zone-label {
  font-size: 11px; font-weight: 700; color: rgba(0,0,0,.35);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 10px;
}
.tow-status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 800;
  margin-bottom: 12px;
}
.tow-header.amber  .tow-status-badge { background: #fde68a; color: #78350f; }
.tow-header.clear  .tow-status-badge { background: #bbf7d0; color: #14532d; }
.tow-header.danger .tow-status-badge { background: #fecaca; color: #7f1d1d; }
.tow-headline {
  font-size: 36px; font-weight: 900;
  line-height: 1.05; letter-spacing: -.025em;
  margin-bottom: 18px;
}
.tow-header.amber  .tow-headline { color: #78350f; }
.tow-header.clear  .tow-headline { color: #14532d; }
.tow-header.danger .tow-headline { color: #7f1d1d; }
.tow-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.tow-stat {
  background: rgba(255,255,255,.7);
  border-radius: 12px; padding: 10px 14px;
}
.tow-stat-val   { font-size: 22px; font-weight: 900; color: var(--c-ink); line-height: 1; }
.tow-stat-label { font-size: 10px; font-weight: 700; color: var(--c-sub); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }

/* report list */
.tow-body {
  flex: 1; overflow-y: auto;
  background: #fff;
  border-radius: 24px 24px 0 0;
  margin-top: -14px;
  padding-bottom: calc(var(--nav-h) + 16px);
}
.tow-body-handle {
  width: 36px; height: 4px;
  background: #e5e7eb; border-radius: 2px;
  margin: 12px auto 16px;
}
.tow-section {
  font-size: 11px; font-weight: 700; color: var(--c-sub);
  text-transform: uppercase; letter-spacing: .07em;
  padding: 0 18px 10px;
}

.r-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer; transition: background .1s;
}
.r-row:last-of-type { border: none; }
.r-row:active { background: var(--c-bg); }
.r-row-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.r-row-icon.tow-i  { background: #fee2e2; }
.r-row-icon.chalk-i{ background: #fef9c3; }
.r-row-body { flex: 1; min-width: 0; }
.r-row-title { font-size: 14px; font-weight: 700; color: var(--c-ink); }
.r-row-sub   { font-size: 12px; color: var(--c-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-row-right { flex-shrink: 0; text-align: right; }
.r-row-time  { font-size: 12px; color: var(--c-sub); }
.r-row-conf  { font-size: 11px; font-weight: 700; color: var(--c-green); margin-top: 3px; }

.vote-expand {
  display: none; padding: 0 18px 14px; gap: 8px;
}
.vote-expand.on { display: flex; }
.vbtn {
  flex: 1; height: 42px; border-radius: 12px;
  border: 1.5px solid #e5e7eb;
  background: var(--c-bg);
  font-size: 13px; font-weight: 700; color: var(--c-ink);
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 6px;
  transition: all .15s;
}
.vbtn.c.on { background: #dcfce7; border-color: #86efac; color: var(--c-green); }
.vbtn.w.on { background: #fee2e2; border-color: #fca5a5; color: var(--c-red); }

/* safe spots */
.safe-label {
  font-size: 11px; font-weight: 700; color: var(--c-sub);
  text-transform: uppercase; letter-spacing: .07em;
  padding: 16px 18px 8px;
}
.safe-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--c-border);
  cursor: pointer; transition: background .1s;
}
.safe-row:last-child { border: none; }
.safe-row:active { background: var(--c-bg); }
.safe-row-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-green); flex-shrink: 0; }
.safe-row-name { font-size: 14px; font-weight: 600; color: var(--c-ink); flex: 1; }
.safe-row-dist { font-size: 13px; font-weight: 700; color: var(--c-blue); }

/* ─────────────────────────────────────────
   DRIVER REPORT — 4 full-screen quadrants
───────────────────────────────────────── */
.dr-screen {
  position: fixed; inset: 0; max-width: 390px; margin: 0 auto;
  z-index: 100;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.dr-screen.on { opacity: 1; pointer-events: all; }
.dr-q {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border: none; cursor: pointer; gap: 10px;
  transition: filter .12s;
}
.dr-q:active { filter: brightness(.88); }
.dr-q.po { background: #16a34a; }
.dr-q.pf { background: #dc2626; }
.dr-q.ts { background: #ea580c; }
.dr-q.tc { background: #2563eb; }
.dr-emoji { font-size: 50px; line-height: 1; }
.dr-label { color: #fff; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.dr-hint  { color: rgba(255,255,255,.65); font-size: 12px; }

.dr-close-btn {
  position: fixed; top: 18px; right: 18px; z-index: 110;
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(0,0,0,.28); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.dr-close-btn.on { opacity: 1; pointer-events: all; }
.dr-close-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* ── Submit flash ── */
.submit-flash {
  position: fixed; inset: 0; max-width: 390px; margin: 0 auto;
  z-index: 120;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.submit-flash.on { opacity: 1; }
.sf-bg { position: absolute; inset: 0; }
.sf-body { position: relative; text-align: center; padding: 0 28px; }
.sf-emoji { font-size: 68px; margin-bottom: 10px; }
.sf-title { color: #fff; font-size: 24px; font-weight: 900; }
.sf-sub   { color: rgba(255,255,255,.8); font-size: 14px; margin-top: 5px; line-height: 1.5; }

/* ── Receipt pill ── */
.receipt-pill {
  position: fixed;
  bottom: calc(var(--nav-h) + 12px);
  left: 50%; transform: translateX(-50%) translateY(0);
  z-index: 130;
  background: var(--c-ink); color: #fff;
  border-radius: 20px;
  padding: 10px 18px;
  font-size: 13px; font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.receipt-pill.on {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
}

/* ── Undo bar ── */
.undo-bar {
  position: fixed; top: 54px; left: 50%; transform: translateX(-50%);
  z-index: 130;
  background: var(--c-ink); border-radius: 14px;
  padding: 12px 18px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
  max-width: 340px; width: calc(100% - 40px);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.undo-bar.on { opacity: 1; pointer-events: all; }
.undo-text { color: #fff; font-size: 13px; font-weight: 500; flex: 1; }
.undo-btn  { color: #60a5fa; font-size: 13px; font-weight: 700; border: none; background: none; cursor: pointer; }

/* ─────────────────────────────────────────
   PARKING DETAIL SHEET
───────────────────────────────────────── */
.sheet-overlay {
  position: fixed; inset: 0; max-width: 390px; margin: 0 auto;
  background: rgba(0,0,0,.38); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.sheet-overlay.on { opacity: 1; pointer-events: all; }

.p-sheet {
  position: fixed; bottom: 0; left: 50%; max-width: 390px; width: 100%;
  max-height: 85vh; overflow-y: auto;
  transform: translate(-50%, 100%);
  background: #fff; border-radius: 24px 24px 0 0;
  z-index: 60;
  transition: transform .36s cubic-bezier(.32,.72,0,1);
  padding-bottom: 32px;
}
.p-sheet.on { transform: translate(-50%, 0); }

.ps-handle {
  width: 36px; height: 4px; background: #e5e7eb;
  border-radius: 2px; margin: 12px auto 0;
}
.ps-inner { padding: 16px 20px; }
.ps-name { font-size: 20px; font-weight: 800; color: var(--c-ink); }
.ps-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.ps-tag {
  font-size: 12px; font-weight: 600; padding: 3px 10px;
  border-radius: 20px; background: var(--c-bg); color: var(--c-sub);
}
.ps-tag.open   { background: #dcfce7; color: #15803d; }
.ps-tag.limited{ background: #fef9c3; color: #a16207; }

/* big distance display */
.ps-dist-row {
  background: var(--c-bg); border-radius: 16px;
  padding: 14px 16px; margin-top: 14px;
  display: flex; align-items: center; gap: 14px;
}
.ps-dist-num {
  font-size: 38px; font-weight: 900; color: var(--c-ink);
  line-height: 1; letter-spacing: -.02em;
}
.ps-dist-detail {}
.ps-dist-unit { font-size: 14px; font-weight: 600; color: var(--c-sub); }
.ps-dist-dir  { font-size: 12px; color: #9ca3af; margin-top: 3px; }

/* info rows */
.ps-divider { height: 1px; background: var(--c-border); margin: 14px 0; }
.ps-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--c-border);
}
.ps-row:last-of-type { border: none; }
.ps-row label { font-size: 14px; color: var(--c-sub); }
.ps-row span  { font-size: 14px; font-weight: 600; color: var(--c-ink); text-align: right; max-width: 60%; }

/* action buttons */
.ps-actions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-top: 14px;
}
.ps-action {
  height: 50px; border: none; border-radius: 14px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: opacity .15s;
}
.ps-action:active { opacity: .85; }
.ps-action.open-btn { background: #dcfce7; color: #15803d; }
.ps-action.full-btn { background: #fee2e2; color: var(--c-red); }

.ps-directions {
  width: 100%; height: 50px; border: none; border-radius: 14px;

.ps-directions svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

function haversine(a, b, c, d) {
  const R = 6371000, dL = (c-a)*Math.PI/180, dN = (d-b)*Math.PI/180;
  const x = Math.sin(dL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x)));
}
// urban driving ~20 km/h = 333 m/min; minimum 1 min
function driveMins(metres) { return Math.max(1, Math.ceil(metres / 333)); }
// walking ~80 m/min; minimum 1 min
function walkMins(metres) { return Math.max(1, Math.ceil(metres / 80)); }

function bearing(a, b, c, d) {
  const dl = (d-b)*Math.PI/180,
    y = Math.sin(dl)*Math.cos(c*Math.PI/180),
    x = Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180) - Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dl),
    br = (Math.atan2(y,x)*180/Math.PI + 360) % 360;
  if (br<22.5||br>=337.5) return '↑ ahead';
  if (br<67.5)  return '↗ ahead-right';
  if (br<112.5) return '→ right';
  if (br<157.5) return '↘ back-right';
  if (br<202.5) return '↓ behind';
  if (br<247.5) return '↙ back-left';
  if (br<292.5) return '← left';
  return '↖ ahead-left';
}

function mkPinIcon(cls, nearest, isReport) {
  const wrapCls = isReport ? 'rpt' : cls;
  const letter = cls === 'tow' ? '🚨' : 'P';
  const nearestEl = nearest ? `<div class="pin-nearest-label">NEAREST</div>` : '';
  return L.divIcon({
    className: '',
    html: `<div class="pin-wrap ${wrapCls}">
      <div class="pin-circle">${letter}</div>
      ${nearestEl}
    </div>`,
    iconSize: nearest ? [40, 58] : [40, 44],
    iconAnchor: nearest ? [20, 50] : [20, 44],
  });
}

    html: `<div class="user-dot"><div class="user-dot-inner"></div></div>`,

}
function mkTowIcon() {
  return L.divIcon({
    className: '',
    html: `<div class="pin-wrap tow"><div class="pin-circle">🚨</div></div>`,

function mkCautionIcon() {

// ─── RESTRICTIONS (Mumbai Traffic Police no-parking / odd-even zones) ────
let restrictions = [];
let restrictionLayers = [];
const RESTRICTION_ALERT_METRES = 60;

function notificationYear(notification) {
  if (!notification) return null;
  const m = String(notification).match(/\b(20\d{2})\b(?!.*\b20\d{2}\b)/);
  return m ? parseInt(m[1], 10) : null;
}

async function loadRestrictions() {
  try {
    const res = await fetch('./data/restrictions.geojson');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geo = await res.json();
    const thisYear = new Date().getFullYear();
    restrictions = (geo.features || []).filter(f => {
      const p = f.properties;
      if (p.permanence !== 'temporary') return true;
      const yr = notificationYear(p.notification);
      return yr === null || yr >= thisYear - 1;
    });
    renderRestrictions();
    console.log(`Loaded ${restrictions.length} restriction segments`);
  } catch (err) {
    console.warn('Could not load restrictions:', err.message);
  }
}

// halfway point along a LineString by cumulative distance (not just array index)
function lineMidpoint(coords) {
  const segLens = [];
  let total = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const d = haversine(coords[i][1], coords[i][0], coords[i+1][1], coords[i+1][0]);
    segLens.push(d);
    total += d;
  }
  let target = total / 2, acc = 0;
  for (let i = 0; i < segLens.length; i++) {
    if (acc + segLens[i] >= target || i === segLens.length - 1) {
      const t = segLens[i] === 0 ? 0 : (target - acc) / segLens[i];
      const [lon1, lat1] = coords[i], [lon2, lat2] = coords[i+1];
      return [lat1 + (lat2-lat1)*t, lon1 + (lon2-lon1)*t];
    }
    acc += segLens[i];
  }
  const last = coords[coords.length - 1];
  return [last[1], last[0]];
}

function renderRestrictions() {
  restrictionLayers.forEach(l => map.removeLayer(l));
  restrictionLayers = [];

  restrictions.forEach(f => {
    const coords = f.geometry.coordinates; // [[lon,lat], ...]
    const latlngs = coords.map(([lon, lat]) => [lat, lon]);
    const p = f.properties;
    const fuzzy = p.match_confidence && p.match_confidence !== 'exact';

    const line = L.polyline(latlngs, {
      color: '#dc2626',
      weight: 4,
      opacity: fuzzy ? 0.45 : 0.65,
      dashArray: p.permanence === 'temporary' ? '6 6' : null,
    }).addTo(map);
    line.bindPopup(`
      <strong>${p.type}</strong><br>
      ${p.division} &middot; ${p.permanence}<br>
      ${p.pdf_url ? `<a href="${p.pdf_url}" target="_blank" rel="noopener">View notification</a>` : 'Notification: ' + p.notification}
      ${fuzzy ? `<br><em style="color:#9ca3af">⚠ fuzzy match — location approximate</em>` : ''}
    `);
    restrictionLayers.push(line);

    if (coords.length >= 2) {
      const [mlat, mlon] = lineMidpoint(coords);
      const marker = L.marker([mlat, mlon], { icon: mkCautionIcon() }).addTo(map);
      marker.on('click', () => line.openPopup());
      restrictionLayers.push(marker);
    }
  });

  checkRestrictionProximity(userLat, userLon);
}

// shortest distance from a point to a lat/lng segment (equirectangular approx, fine at city scale)
function pointToSegmentMeters(plat, plon, alat, alon, blat, blon) {
  const R = 6371000;
  const latRef = (alat + blat) / 2 * Math.PI / 180;
  const toXY = (lat, lon) => [(lon * Math.PI/180) * Math.cos(latRef) * R, (lat * Math.PI/180) * R];
  const [px, py] = toXY(plat, plon);
  const [ax, ay] = toXY(alat, alon);
  const [bx, by] = toXY(blat, blon);
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq === 0 ? 0 : ((px-ax)*dx + (py-ay)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.sqrt((px-cx)**2 + (py-cy)**2);
}

function checkRestrictionProximity(lat, lon) {
  let nearest = null, nearestDist = Infinity;
  restrictions.forEach(f => {
    const coords = f.geometry.coordinates;
    for (let i = 0; i < coords.length - 1; i++) {
      const [lon1, lat1] = coords[i], [lon2, lat2] = coords[i+1];
      const d = pointToSegmentMeters(lat, lon, lat1, lon1, lat2, lon2);
      if (d < nearestDist) { nearestDist = d; nearest = f; }
    }
  });

  const banner = document.getElementById('restrictionBanner');
  if (nearest && nearestDist <= RESTRICTION_ALERT_METRES) {
    document.getElementById('restrictionBannerSub').textContent =
      `${nearest.properties.type} · ${nearest.properties.division}`;
    banner.classList.add('on');
  } else {
    banner.classList.remove('on');
  }
}

function renderAll() {
  const vs = visible();
  vs.forEach(s => {
    s.dist = haversine(userLat, userLon, s.lat, s.lon);
    s.dir  = bearing(userLat, userLon, s.lat, s.lon);
  });
  const sorted = [...vs].sort((a,b) => a.dist - b.dist);

  spotMarkers.forEach(m => map.removeLayer(m));
  spotMarkers = [];

  sorted.forEach((s, i) => {
    const m = L.marker([s.lat, s.lon], {
      icon: mkPinIcon(s.cls, i === 0, false),
      zIndexOffset: i === 0 ? 100 : 0,
    }).addTo(map);
    m.on('click', () => openSpot(s));
    spotMarkers.push(m);
  });

  // user
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([userLat, userLon], {
    icon: mkUserIcon(), zIndexOffset: -100,
  }).addTo(map);

  // cards
  document.getElementById('cardsStrip').innerHTML = sorted.map((s, i) => `
    <div class="p-card" onclick="openSpotById(${s.id})">
      <div class="p-card-top">
        <div class="p-card-name">${s.name}</div>
        <span class="p-card-badge ${s.status}">${s.status === 'open' ? 'Open' : 'Limited'}</span>
      </div>
      <div>
        <span class="p-card-dist">${driveMins(s.dist)}<span class="unit-min"> min drive ${s.dir.split(' ')[0]}</span></span>
      </div>
      <div class="p-card-meta">
        ${i === 0 ? '<strong>Nearest · </strong>' : ''}${s.hours} · ${s.price}
      </div>
    </div>
  `).join('');

  checkRestrictionProximity(userLat, userLon);
}

// ─── GEOLOCATION ─────────────────────────────────────────────
function locateUser() {
  if (!navigator.geolocation) { renderAll(); return; }
  navigator.geolocation.getCurrentPosition(p => {
    userLat = p.coords.latitude;
    userLon = p.coords.longitude;
    map.setView([userLat, userLon], 16, { animate: true });
    renderAll();
  }, () => renderAll(), { enableHighAccuracy: true, timeout: 8000 });
}

// ─── SEARCH ──────────────────────────────────────────────────
// Shared Google Places lookup used by both the home search bar
// (autocomplete only) and the results-screen search bar (re-search).
async function fetchPlaces(q) {
  try {
    const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_PLACES_API_KEY,
        'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.location',
      },
      body: JSON.stringify({
        textQuery: q,
        locationBias: {
          circle: { center: { latitude: 19.0760, longitude: 72.8777 }, radius: 50000 },
        },
        regionCode: 'IN',
      }),
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.places || [];
  } catch (e) { return []; }
}
function renderPlaceDropdown(places, onPickFnName) {
  return places.map(p => `
    <div class="sri" onclick="${onPickFnName}(${p.location.latitude},${p.location.longitude},'${(p.displayName?.text || '').replace(/'/g,"\\'")}')">
      <div class="sri-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg></div>
      <div class="sri-text">
        <div class="sri-main">${p.displayName?.text || ''}</div>
        <div class="sri-sub">${p.formattedAddress || ''}</div>
      </div>
    </div>
  `).join('');
}

let sTimer = null;
const sInput = document.getElementById('searchInput');
const sResults = document.getElementById('searchResults');

sInput.addEventListener('input', () => {
  const q = sInput.value.trim();
  document.getElementById('searchClear').style.display = q ? 'block' : 'none';
  clearTimeout(sTimer);
  if (q.length < 3) { sResults.style.display = 'none'; return; }
  sTimer = setTimeout(async () => {
    const places = await fetchPlaces(q);
    sResults.style.display = places.length ? 'block' : 'none';
    sResults.innerHTML = renderPlaceDropdown(places, 'goTo');
  }, 420);
});
sInput.addEventListener('focus', () => {
  if (sInput.value.trim().length >= 3) sResults.style.display = 'block';
});
function clearSearch() {
  sInput.value = '';
  document.getElementById('searchClear').style.display = 'none';
  sResults.style.display = 'none';
  sInput.focus();
}
document.addEventListener('click', e => {
  if (!e.target.closest('.search-bar') && !e.target.closest('.search-results'))
    sResults.style.display = 'none';
});

// picking a home-search result opens the full-screen results mode
function goTo(lat, lon, name) {
  sResults.style.display = 'none';
  openResultsScreen(+lat, +lon, name);
}

// ─── RESULTS SCREEN (full-screen: map top / list bottom) ─────
let resultsMap = null;
let resultsMarkers = [];
let resultsTargetMarker = null;

function ensureResultsMap(lat, lon) {
  if (resultsMap) return resultsMap;
  // initialize already centered on the target — no generic-city flash before flying in
  resultsMap = L.map('resultsMap', { zoomControl: false, attributionControl: false }).setView([lat, lon], 15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd',
  }).addTo(resultsMap);
  return resultsMap;
}
function mkTargetIcon() {
  return L.divIcon({
    className: '',
    html: `<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;background:var(--c-ink);transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35);">
      <div style="width:12px;height:12px;border-radius:50%;background:#fff;transform:rotate(45deg);"></div>
    </div>`,
    iconSize: [34, 34], iconAnchor: [17, 34],
  });
}

function openResultsScreen(lat, lon, name) {
  const isFirstOpen = !resultsMap;
  const rmap = ensureResultsMap(lat, lon);

  document.getElementById('map-screen').classList.remove('on');
  document.getElementById('tow-screen').classList.remove('on');
  document.getElementById('results-screen').classList.add('on');
  setTimeout(() => rmap.invalidateSize(), 50);

  document.getElementById('resultsSearchInput').value = name;
  document.getElementById('resultsSearchResults').style.display = 'none';

  if (!isFirstOpen) rmap.setView([lat, lon], 15, { animate: true });
  if (resultsTargetMarker) rmap.removeLayer(resultsTargetMarker);
  resultsTargetMarker = L.marker([lat, lon], { icon: mkTargetIcon(), zIndexOffset: 100 }).addTo(rmap);

  const sorted = visible()
    .map(s => ({ ...s, dist: haversine(lat, lon, s.lat, s.lon) }))
    .sort((a, b) => a.dist - b.dist);

  document.getElementById('resultsLocationName').textContent = name;
  document.getElementById('resultsLocationSub').textContent =
    sorted.length ? `${sorted.length} parking spot${sorted.length === 1 ? '' : 's'} nearby` : 'No parking spots nearby';

  resultsMarkers.forEach(m => rmap.removeLayer(m));
  resultsMarkers = [];

  const list = document.getElementById('resultsList');
  if (!sorted.length) {
    list.innerHTML = `<div class="rl-empty">No parking spots found near this location.</div>`;
    return;
  }

  list.innerHTML = sorted.map(s => `
    <div class="rl-card" id="rlCard-${s.id}" onclick="focusResultCard(${s.id})">
      <div class="rl-card-badge" style="color:${s.status === 'open' ? 'var(--c-green)' : 'var(--c-yellow)'}">P</div>
      <div class="rl-card-body">
        <div class="rl-card-name">${s.name}</div>
        <div class="rl-card-meta">${s.status === 'open' ? 'Open' : 'Limited'} · ${s.hours} · ${s.price}</div>
      </div>
      <div class="rl-card-dist">
        <div class="rl-card-dist-num">${walkMins(s.dist)}</div>
        <div class="rl-card-dist-unit">min walk</div>
      </div>
      <button class="rl-card-directions" onclick="event.stopPropagation(); window.open('${s.gmaps}', '_blank', 'noopener')">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
      </button>
    </div>
  `).join('');

  sorted.forEach(s => {
    const m = L.marker([s.lat, s.lon], { icon: mkPinIcon(s.cls, false, false) }).addTo(rmap);
    m.on('click', () => focusResultCard(s.id, true));
    m._spotId = s.id;
    resultsMarkers.push(m);
  });
}

function focusResultCard(id, fromPin) {
  document.querySelectorAll('.rl-card.active').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`rlCard-${id}`);
  if (card) {
    card.classList.add('active');
    if (!fromPin) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  const m = resultsMarkers.find(m => m._spotId === id);
  if (m && resultsMap) resultsMap.panTo(m.getLatLng(), { animate: true });
  if (!fromPin) openSpotById(id);
}

function closeResultsScreen() {
  document.getElementById('results-screen').classList.remove('on');
  document.getElementById('map-screen').classList.add('on');
  setTimeout(() => map.invalidateSize(), 50);
}

let rsTimer = null;
const rsInput = document.getElementById('resultsSearchInput');
const rsResults = document.getElementById('resultsSearchResults');
rsInput.addEventListener('input', () => {
  const q = rsInput.value.trim();
  document.getElementById('resultsSearchClear').style.display = q ? 'block' : 'none';
  clearTimeout(rsTimer);
  if (q.length < 3) { rsResults.style.display = 'none'; return; }
  rsTimer = setTimeout(async () => {
    const places = await fetchPlaces(q);
    rsResults.style.display = places.length ? 'block' : 'none';
    rsResults.innerHTML = renderPlaceDropdown(places, 'goToWithinResults');
  }, 420);
});
rsInput.addEventListener('focus', () => {
  if (rsInput.value.trim().length >= 3) rsResults.style.display = 'block';
});
function goToWithinResults(lat, lon, name) {
  rsResults.style.display = 'none';
  openResultsScreen(+lat, +lon, name);
}
function clearResultsSearch() {
  rsInput.value = '';
  document.getElementById('resultsSearchClear').style.display = 'none';
  rsResults.style.display = 'none';
  rsInput.focus();
}
document.addEventListener('click', e => {
  if (!e.target.closest('#results-screen .search-bar'))
    rsResults.style.display = 'none';
});

// ─── TABS ────────────────────────────────────────────────────
function switchTab(t) {
  document.getElementById('map-screen').classList.toggle('on', t === 'map');
  document.getElementById('results-screen').classList.remove('on');
  ['nb-map','nb-map2'].forEach(id => { const e = document.getElementById(id); if(e) e.classList.toggle('on', t==='map'); });
  if (t === 'map') setTimeout(() => map.invalidateSize(), 50);
}

// ─── REPORT ──────────────────────────────────────────────────
function openReport() {
  document.getElementById('drScreen').classList.add('on');
  document.getElementById('drClose').classList.add('on');
}
function closeReport() {
  document.getElementById('drScreen').classList.remove('on');
  document.getElementById('drClose').classList.remove('on');
}
function submitReport(type, emoji, color) {
  closeReport();
  switchTab('map');

  // drop a highlighted pin at user location
  const rPin = L.marker([userLat, userLon], {
    icon: mkPinIcon('green', false, true),
    zIndexOffset: 200,
  }).addTo(map);
  map.setView([userLat, userLon], 16, { animate: true });
  setTimeout(() => map.removeLayer(rPin), 90000);

  // flash
  const flash = document.getElementById('submitFlash');
  document.getElementById('sfBg').style.background = color;
  document.getElementById('sfEmoji').textContent = emoji;
  document.getElementById('sfTitle').textContent = type + ' reported!';
  flash.classList.add('on');
  setTimeout(() => {
    flash.classList.remove('on');
    // receipt pill: "Heads up sent to N drivers nearby"
    showReceiptPill();
    const bar = document.getElementById('undoBar');
    document.getElementById('undoText').textContent = 'Reported: ' + type;
    bar.classList.add('on');
    bar._t = setTimeout(() => bar.classList.remove('on'), 4000);
  }, 950);
}
function undoReport() {
  const bar = document.getElementById('undoBar');
  clearTimeout(bar._t);
  bar.classList.remove('on');
}

// ─── PARKING SHEET ───────────────────────────────────────────
let activeSpot = null;
function openSpotById(id) { openSpot(spots.find(s => s.id === id)); }
function openSpot(s) {
  if (!s) return;
  activeSpot = s;
  document.getElementById('psName').textContent = s.name;
  document.getElementById('psPrice').textContent = s.price;
  document.getElementById('psHours').textContent = s.hours;
  document.getElementById('psPay').textContent   = s.pay;
  document.getElementById('psType').textContent  = s.type;
  document.getElementById('psConf').textContent  = s.conf;
  document.getElementById('psDist').textContent  = driveMins(s.dist);
  document.getElementById('psDir').textContent   = s.dir || '';
  document.getElementById('psTags').innerHTML =
    `<span class="ps-tag ${s.status}">${s.status === 'open' ? 'Open' : 'Limited'}</span>` +
    `<span class="ps-tag">${s.type}</span>`;
  document.getElementById('sheetOverlay').classList.add('on');
  document.getElementById('pSheet').classList.add('on');
}
function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('on');
  document.getElementById('pSheet').classList.remove('on');
  activeSpot = null;
}
function markSpot(action) {
  if (!activeSpot) return;
  const s = spots.find(x => x.id === activeSpot.id);
  if (s) {
    s.status = action === 'open' ? 'open' : 'limited';
    s.cls    = action === 'open' ? 'green' : 'yellow';
    s.conf   = 'Just now · you';
  }
  closeSheet();
  renderAll();
}

function openInGoogleMaps() {
  if (!activeSpot) return;
  const url = activeSpot.gmaps ||
    `https://www.google.com/maps/search/?api=1&query=${activeSpot.lat},${activeSpot.lon}`;
  window.open(url, '_blank', 'noopener');
}

// ─── RECEIPT PILL ────────────────────────────────────────────
function nearbyCount() {
  // higher during peak hours (8–10am, 5–8pm IST)
  const h = new Date().getHours();
  const peak = (h >= 8 && h < 10) || (h >= 17 && h < 20);
  const base = peak ? 9 : 6;
  // seed by minute so it's stable within a minute but varies across time
  const seed = new Date().getMinutes();
  return base + (seed % (peak ? 6 : 5));
}
function showReceiptPill() {
  const pill = document.getElementById('receiptPill');
  const n = nearbyCount();
  pill.textContent = `Heads up sent to ${n} drivers nearby`;
  pill.classList.add('on');
  setTimeout(() => pill.classList.remove('on'), 2500);
}

// ─── TOW VOTES ───────────────────────────────────────────────
function toggleVote(id) {
  const el = document.getElementById(id), was = el.classList.contains('on');
  document.querySelectorAll('.vote-expand').forEach(e => e.classList.remove('on'));
  if (!was) el.classList.add('on');
}
function castVote(btn) {
  if (btn.classList.contains('on')) return; // already voted
  const row = btn.closest('.vote-expand');
  row.querySelectorAll('.vbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  // animate confirm count if this is a confirm vote
  if (btn.classList.contains('c')) {
    const rRow = row.previousElementSibling;
    const confEl = rRow.querySelector('.r-row-conf');
    if (confEl) {
      const m = confEl.textContent.match(/(\d+)/);
      if (m) {
        const cur = parseInt(m[1]);
        const next = cur + 1;
        // flash old → new
        confEl.style.transition = 'none';
        confEl.style.opacity = '0';
        confEl.style.transform = 'translateY(4px)';
        requestAnimationFrame(() => {
          confEl.textContent = `✓ ${next} confirmed`;
          requestAnimationFrame(() => {
            confEl.style.transition = 'opacity .25s ease, transform .25s ease';
            confEl.style.opacity = '1';
            confEl.style.transform = 'translateY(0)';
          });
        });
      }
    }
  }
  setTimeout(() => row.classList.remove('on'), 600);
}

// ─── INIT ────────────────────────────────────────────────────
async function initApp() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/spots?select=*&order=id.asc`,
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        },
        signal: AbortSignal.timeout(5000), // 5-second timeout
      }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('Empty response');
    // derive cls from status (not stored in DB)
    spots = data.map(s => ({ ...s, cls: s.status === 'open' ? 'green' : 'yellow' }));
    console.log(`Loaded ${spots.length} spots from Supabase`);
  } catch (err) {
    console.warn('Supabase unreachable, using fallback data:', err.message);
    spots = FALLBACK_SPOTS;
  }
  spots.forEach(s => {
    s.dist = haversine(userLat, userLon, s.lat, s.lon);
    s.dir  = bearing(userLat, userLon, s.lat, s.lon);
  });
  renderAll();
  locateUser();
  loadRestrictions();
}
initApp();
